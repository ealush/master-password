<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>MasterPassword</title>
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header class="app-header">
        <button class="theme-toggle" type="button" aria-label="Toggle dark and light mode">
          ☀️
        </button>
      </header>

      <form id="generator-form" class="master-strings">
        <section class="settings-card">
          <p>Password Length</p>
          <label class="settings" for="length-slider">
            <input id="length-slider" class="length-slider" type="range" min="4" max="40" value="15" />
            <input class="length" type="number" min="4" max="40" value="15" />
          </label>
        </section>

        <section class="phrases-card">
          <h2>Master Phrases</h2>
          <div class="str-container"></div>
          <button class="add" type="button">+ Add Phrase</button>
        </section>
      </form>

      <section class="bottom-dock">
        <button class="generate" type="submit" form="generator-form">Generate</button>
        <div class="result">
          <div class="result-input-wrapper">
            <input type="text" readonly />
            <button class="copy-result" type="button" aria-label="Copy generated password">⧉</button>
          </div>
        </div>
      </section>
    </main>
    <script src="https://unpkg.com/vent-dom"></script>
    <script src="./index.js"></script>
  </body>
</html>
